# This job is to test different maven profiles in sdk branch again Pull Request raised
# This workflow targets Java with Maven execution

name: Java SDK Test workflow for Maven on workflow_dispatch

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'The full commit id to build'
        required: true

jobs:
  comment-run:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        java: [ '8', '11', '17' ]
        os: ['windows-latest']
        exclude:
          - java: '8'
            os: 'macos-latest'
    name: Cucumber Repo ${{ matrix.Java }} - ${{ matrix.os }} Sample
    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.commit_sha }}
      - uses: actions/github-script@98814c53be79b1d30f795b907e553d8679345975
        id: status-check-in-progress
        env:
          job_name: Cucumber Repo ${{ matrix.Java }} - ${{ matrix.os }} Sample
          commit_sha: ${{ github.event.inputs.commit_sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const result = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: process.env.job_name,
              head_sha: process.env.commit_sha,
              status: 'in_progress'
            }).catch((err) => ({status: err.status, response: err.response}));
            console.log(`The status-check response : ${result.status} Response : ${JSON.stringify(result.response)}`)
            if (result.status !== 201) {
              console.log('Failed to create check run')
            }
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
      - name: Set up Gradle 8.10.1 (Java 8)
        if: matrix.java == '8'
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.1'
      - name: Set up Gradle 8.10.1 (Java 11)
        if: matrix.java == '11'
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.1'
      - name: Set up Gradle 9.4.1 (Java 17)
        if: matrix.java == '17'
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.4.1'
      - name: Run mvn test
        run: |
          mvn compile
          mvn test
      - name: Run mvn profile sample-local-test
        run: |
          mvn compile
          mvn test -P sample-local-test
      - name: Run mvn profile sample-test
        run: |
          mvn compile
          mvn test -P sample-test
      - name: Run gradle task sampleTest
        timeout-minutes: 25
        shell: pwsh
        run: |
          # Start background monitor - logs running processes every 30 seconds
          $monitor = Start-Job -ScriptBlock {
            while ($true) {
              $timestamp = Get-Date -Format 'HH:mm:ss'
              Write-Output "[$timestamp] === Running Java/Gradle processes ==="
              Get-Process -Name java,gradle -ErrorAction SilentlyContinue | Select-Object Id, ProcessName, CPU, @{N='Mem(MB)';E={[math]::Round($_.WorkingSet/1MB,1)}}, StartTime | Format-Table -AutoSize | Out-String
              Start-Sleep -Seconds 30
            }
          }
          try {
            gradle clean sampleTest
          } finally {
            Stop-Job $monitor
            Write-Host "=== Monitor output during test ==="
            Receive-Job $monitor
            Remove-Job $monitor
            Write-Host "=== Java processes still alive after test ==="
            Get-Process -Name java -ErrorAction SilentlyContinue | Format-Table Id, ProcessName, CPU, @{N='Mem(MB)';E={[math]::Round($_.WorkingSet/1MB,1)}}, StartTime -AutoSize
          }
      - name: Run gradle task sampleLocalTest
        timeout-minutes: 25
        shell: pwsh
        run: |
          # Start background monitor - logs running processes every 30 seconds
          $monitor = Start-Job -ScriptBlock {
            while ($true) {
              $timestamp = Get-Date -Format 'HH:mm:ss'
              Write-Output "[$timestamp] === Running Java/Gradle processes ==="
              Get-Process -Name java,gradle -ErrorAction SilentlyContinue | Select-Object Id, ProcessName, CPU, @{N='Mem(MB)';E={[math]::Round($_.WorkingSet/1MB,1)}}, StartTime | Format-Table -AutoSize | Out-String
              Start-Sleep -Seconds 30
            }
          }
          try {
            gradle clean sampleLocalTest
          } finally {
            Stop-Job $monitor
            Write-Host "=== Monitor output during test ==="
            Receive-Job $monitor
            Remove-Job $monitor
            Write-Host "=== Java processes still alive after test ==="
            Get-Process -Name java -ErrorAction SilentlyContinue | Format-Table Id, ProcessName, CPU, @{N='Mem(MB)';E={[math]::Round($_.WorkingSet/1MB,1)}}, StartTime -AutoSize
          }
      - name: Upload Gradle logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs-${{ matrix.java }}-${{ matrix.os }}
          path: |
            build/reports/tests/
            build/test-results/
            log/
          retention-days: 7
      - if: always()
        uses: actions/github-script@98814c53be79b1d30f795b907e553d8679345975
        id: status-check-completed
        env:
          conclusion: ${{ job.status }}
          job_name: Cucumber Repo ${{ matrix.Java }} - ${{ matrix.os }} Sample
          commit_sha: ${{ github.event.inputs.commit_sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const result = await github.rest.checks.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            name: process.env.job_name,
            head_sha: process.env.commit_sha,
            status: 'completed',
            conclusion: process.env.conclusion
            }).catch((err) => ({status: err.status, response: err.response}));
            console.log(`The status-check response : ${result.status} Response : ${JSON.stringify(result.response)}`)
            if (result.status !== 201) {
              console.log('Failed to create check run')
            }
